[package]
name = "dsh-launcher"
version = "0.1.2"
description = "A lightweight cross-platform installer and launcher for DeepSeek Harness"
authors = ["DeepSeek Harness contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "fs"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["local-offset", "macros"] }
libc = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
